# YCFRP s2609.031 —— FRP 双端管理面板 Docker Compose 部署文件（ARM64）
#
# 适用：树莓派 4/5、NanoPi、AWS Graviton 等 64 位 ARM 设备。
#
# 用法：
#   mkdir -p /opt/ycfrp && cd /opt/ycfrp
#   把本文件放到 /opt/ycfrp/docker-compose.yml
#   docker compose up -d
#   浏览器访问 http://<服务器IP>:38080 （默认账号 admin / admin）
#
# 升级：
#   docker compose pull && docker compose up -d

services:
  ycfrp:
    image: ycyingchen/ycfrp:arm64-latest
    container_name: ycfrp
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/var/lib/ycfrp
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host

  # 如需桥接网络，删除 network_mode: host 并启用下面的端口映射：
  #   ports:
  #     - "38080:38080"
  #     - "7000:7000"
  #     - "7500:7500"
  #     - "8080:8080"
  #     - "8443:8443"
